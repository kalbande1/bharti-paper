<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>लॉगिन करा | महाराष्ट्र पोलीस भरती परीक्षा पोर्टल</title>
    <!-- Google Fonts: Noto Sans Devanagari & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- सानुकूल स्टाइलशीट -->
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: 'Noto Sans Devanagari', 'Inter', sans-serif;
            background-color: #f8fafc;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- १. नेव्हिगेशन हेडर -->
    <header class="bg-slate-900 border-b border-slate-800 text-white py-3.5 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between">
            <a href="index.html" class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-full bg-amber-500 text-slate-950 flex items-center justify-center font-bold text-lg shadow-md border-2 border-amber-300">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <span class="font-bold text-base sm:text-lg text-white">पोलीस भरती परीक्षा पोर्टल</span>
            </a>
            <a href="register.html" class="text-sm text-slate-300 hover:text-amber-400 font-medium transition flex items-center">
                <i class="fa-solid fa-user-plus mr-1.5"></i> नवीन नोंदणी करा
            </a>
        </div>
    </header>

    <!-- २. मुख्य लॉगिन कार्ड -->
    <main class="flex-grow flex items-center justify-center px-4 py-10 sm:py-16">
        <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
            <!-- कार्ड हेडर -->
            <div class="bg-gradient-to-r from-slate-900 via-blue-950 to-slate-900 p-6 sm:p-7 text-white text-center border-b border-slate-800">
                <div class="w-14 h-14 mx-auto rounded-2xl bg-amber-500/20 text-amber-400 border border-amber-500/30 flex items-center justify-center text-2xl mb-3 shadow-inner">
                    <i class="fa-solid fa-right-to-bracket"></i>
                </div>
                <h2 class="text-2xl font-extrabold tracking-wide">खात्यात लॉगिन करा</h2>
                <p class="text-xs sm:text-sm text-slate-300 mt-1">
                    सराव पेपर्स सोडवण्यासाठी तुमचा मोबाईल नंबर व पासवर्ड प्रविष्ट करा.
                </p>
            </div>

            <!-- लॉगिन फॉर्म -->
            <form id="loginForm" class="p-6 sm:p-8 space-y-4">
                <!-- १. मोबाईल नंबर किंवा ईमेल -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                        <i class="fa-solid fa-user text-amber-500 mr-1"></i> नोंदणीकृत मोबाईल नंबर किंवा ईमेल *
                    </label>
                    <input 
                        type="text" 
                        id="identifier" 
                        required 
                        placeholder="उदा. 9876543210 किंवा email@gmail.com"
                        class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 text-sm outline-none transition font-medium"
                    >
                </div>

                <!-- २. पासवर्ड -->
                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider">
                            <i class="fa-solid fa-lock text-amber-500 mr-1"></i> पासवर्ड *
                        </label>
                        <a href="forgot-password.html" class="text-xs text-blue-700 hover:underline font-semibold">
                            पासवर्ड विसरलात?
                        </a>
                    </div>
                    <div class="relative">
                        <input 
                            type="password" 
                            id="password" 
                            required 
                            placeholder="••••••••"
                            class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 text-sm outline-none transition pr-10"
                        >
                        <button 
                            type="button" 
                            id="togglePassword" 
                            class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600"
                        >
                            <i class="fa-solid fa-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- लॉगिन सबमिट बटण -->
                <div class="pt-3">
                    <button 
                        type="submit" 
                        id="loginBtn"
                        class="w-full py-3.5 px-4 rounded-xl font-bold text-slate-950 bg-amber-500 hover:bg-amber-400 shadow-lg hover:shadow-amber-500/25 transition-all text-base flex items-center justify-center space-x-2"
                    >
                        <i class="fa-solid fa-right-to-bracket"></i>
                        <span>लॉगिन करा (Login)</span>
                    </button>
                </div>
            </form>

            <!-- कार्ड तळटीप -->
            <div class="p-4 bg-slate-50 border-t border-slate-200 text-center text-xs text-slate-600">
                नवीन विद्यार्थी आहात का? 
                <a href="register.html" class="text-blue-700 font-bold hover:underline ml-1">येथे नवीन नोंदणी करा</a>
            </div>
        </div>
    </main>

    <!-- ३. सामान्य फूटर -->
    <footer class="bg-slate-900 text-slate-400 text-xs py-4 text-center border-t border-slate-800">
        महाराष्ट्र पोलीस भरती सराव परीक्षा पोर्टल &copy; २०२५-२०२६.
    </footer>

    <!-- Supabase CDN आणि कॉन्फिगरेशन स्क्रिप्ट -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>

    <script>
        // पासवर्ड दाखवा/लपवा टॉगल
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const toggleIcon = document.getElementById('toggleIcon');

        togglePassword.addEventListener('click', () => {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
            toggleIcon.className = isPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
        });

        // सुरक्षित पासवर्ड हॅशिंग (SHA-256)
        async function localHashPassword(plain) {
            try {
                const msgBuffer = new TextEncoder().encode(plain.trim());
                const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            } catch (e) {
                let h = 0;
                for (let i = 0; i < plain.length; i++) {
                    h = ((h << 5) - h) + plain.charCodeAt(i);
                    h |= 0;
                }
                return "hash_" + Math.abs(h);
            }
        }

        // Supabase क्लायंट मिळवणे
        function getSupabaseClient() {
            if (window.supabaseClient && typeof window.supabaseClient.from === 'function') {
                return window.supabaseClient;
            }

            const url = localStorage.getItem('pyq_supabase_url') || (typeof DEFAULT_SUPABASE_URL !== 'undefined' ? DEFAULT_SUPABASE_URL : '');
            const key = localStorage.getItem('pyq_supabase_anon_key') || (typeof DEFAULT_SUPABASE_ANON_KEY !== 'undefined' ? DEFAULT_SUPABASE_ANON_KEY : '');

            if (window.supabase && typeof window.supabase.createClient === 'function' && 
                url && !url.includes("your-project-id") && 
                key && !key.includes("your-supabase-anon-key")) {
                try {
                    window.supabaseClient = window.supabase.createClient(url, key, {
                        auth: { persistSession: true, autoRefreshToken: true }
                    });
                    return window.supabaseClient;
                } catch (e) {
                    console.error("Supabase निर्मिती अपवाद:", e);
                }
            }
            return null;
        }

        // लॉगिन फॉर्म सबमिशन
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const identifierInput = document.getElementById('identifier');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const identifier = identifierInput.value.trim();
            const password = passwordInput.value;

            if (!identifier || !password) {
                Swal.fire({
                    icon: 'warning',
                    title: 'अपूर्ण माहिती',
                    text: 'कृपया मोबाईल नंबर किंवा ईमेल आणि पासवर्ड दोन्ही प्रविष्ट करा.',
                    confirmButtonColor: '#f59e0b'
                });
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> पडताळणी सुरू आहे...';

            try {
                const client = getSupabaseClient();
                if (!client) {
                    throw new Error("Supabase शी संपर्क होऊ शकला नाही. कृपया supabase-config.js तपासा.");
                }

                const pwdHash = await localHashPassword(password);

                // मोबाईल किंवा ईमेलने शोधणे
                let query = client.from('students').select('*');
                if (/^\d{10}$/.test(identifier)) {
                    query = query.eq('mobile', identifier);
                } else {
                    query = query.ilike('email', identifier);
                }

                const { data, error } = await query;
                if (error) throw error;

                if (!data || data.length === 0) {
                    Swal.fire({
                        icon: 'error',
                        title: 'खाते सापडले नाही',
                        text: 'या मोबाईल नंबर/ईमेलने नोंदणीकृत खाते सापडले नाही. कृपया नवीन नोंदणी करा.',
                        confirmButtonColor: '#dc2626',
                        confirmButtonText: 'समजले'
                    });
                    return;
                }

                const user = data[0];

                // पासवर्ड पडताळणी
                if (user.password_hash !== pwdHash) {
                    Swal.fire({
                        icon: 'error',
                        title: 'लॉगिन अयशस्वी',
                        text: 'मोबाईल नंबर किंवा पासवर्ड चुकीचा आहे. कृपया पुन्हा तपासा.',
                        confirmButtonColor: '#dc2626',
                        confirmButtonText: 'पुन्हा टाका'
                    });
                    return;
                }

                // ॲडमिन असल्यास थेट ॲडमिन पॅनेलवर घेऊन जाणे
                if (user.role === 'admin') {
                    localStorage.setItem('pyq_user', JSON.stringify(user));
                    Swal.fire({
                        icon: 'success',
                        title: 'ॲडमिन लॉगिन यशस्वी!',
                        text: 'ॲडमिन पॅनेलवर घेऊन जात आहोत...',
                        timer: 1200,
                        showConfirmButton: false
                    }).then(() => {
                        window.location.href = 'admin.html';
                    });
                    return;
                }

                // विद्यार्थ्याची मंजुरी तपासणे
                if (user.status === 'pending' || !user.is_approved) {
                    Swal.fire({
                        icon: 'info',
                        title: 'मंजुरी प्रलंबित आहे',
                        text: 'तुमचे खाते अजून ॲडमिनने मंजूर केलेले नाही. ॲडमिनच्या मंजुरीनंतर तुमचे लॉगिन सुरू होईल. कृपया वाट पहा.',
                        confirmButtonColor: '#3b82f6',
                        confirmButtonText: 'समजले'
                    });
                    return;
                }

                if (user.status === 'rejected') {
                    Swal.fire({
                        icon: 'error',
                        title: 'नोंदणी रद्द केली आहे',
                        text: 'तुमची नोंदणी ॲडमिनने रद्द (Reject) केली आहे. अधिक माहितीसाठी प्रशासकाशी संपर्क साधा.',
                        confirmButtonColor: '#dc2626'
                    });
                    return;
                }

                if (user.status === 'deactivated') {
                    Swal.fire({
                        icon: 'warning',
                        title: 'खाते बंद करण्यात आले आहे',
                        text: 'तुमचे खाते तात्पुरते बंद (Deactivate) करण्यात आले आहे.',
                        confirmButtonColor: '#f59e0b'
                    });
                    return;
                }

                // मंजूर विद्यार्थी -> डॅशबोर्डवर नेणे
                localStorage.setItem('pyq_user', JSON.stringify(user));
                Swal.fire({
                    icon: 'success',
                    title: 'लॉगिन यशस्वी!',
                    text: 'सराव पेपर्स डॅशबोर्डवर घेऊन जात आहोत...',
                    timer: 1200,
                    showConfirmButton: false
                }).then(() => {
                    window.location.href = 'dashboard.html';
                });

            } catch (err) {
                console.error("लॉगिन त्रुटी:", err);
                Swal.fire({
                    icon: 'error',
                    title: 'लॉगिन त्रुटी',
                    text: (err && err.message) ? err.message : 'लॉगिन करताना तांत्रिक अडचण आली.',
                    confirmButtonColor: '#dc2626'
                });
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket mr-2"></i> लॉगिन करा (Login)';
            }
        });
    </script>
</body>
</html>
