<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>पासवर्ड रीसेट करा | महाराष्ट्र पोलीस भरती परीक्षा पोर्टल</title>
    <!-- Google Fonts: Noto Sans Devanagari & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- सानुकूल स्टाइलशीट -->
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: 'Noto Sans Devanagari', 'Inter', sans-serif;
            background-color: #0f172a;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- १. सामान्य हेडर -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
            <a href="index.html" class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-amber-500 text-slate-950 flex items-center justify-center font-bold text-xl shadow-lg border-2 border-amber-300">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-base sm:text-lg leading-tight text-white">
                        महाराष्ट्र पोलीस भरती
                    </h1>
                    <p class="text-xs text-amber-400 font-medium">सराव परीक्षा व PYQ पोर्टल</p>
                </div>
            </a>
            <a href="login.html" class="text-xs font-bold text-slate-300 hover:text-white px-3 py-1.5 rounded-lg border border-slate-700 bg-slate-800 transition">
                <i class="fa-solid fa-arrow-left mr-1"></i> लॉगिनकडे जा
            </a>
        </div>
    </header>

    <!-- २. पासवर्ड रीसेट कार्ड -->
    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="w-full max-w-md bg-white text-slate-900 rounded-3xl shadow-2xl border border-slate-800 overflow-hidden">
            
            <div class="p-6 sm:p-8 bg-slate-950 text-white text-center border-b border-slate-800">
                <div class="w-12 h-12 mx-auto rounded-2xl bg-amber-500/20 text-amber-400 border border-amber-500/30 flex items-center justify-center text-xl mb-3">
                    <i class="fa-solid fa-key"></i>
                </div>
                <h2 class="text-xl font-extrabold">पासवर्ड रीसेट करा</h2>
                <p class="text-xs text-slate-400 mt-1">तुमचा नोंदणीकृत मोबाईल नंबर व ईमेल प्रविष्ट करा.</p>
            </div>

            <!-- टप्पा १: पडताळणी फॉर्म -->
            <form id="verifyForm" class="p-6 sm:p-8 space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                        मोबाईल नंबर *
                    </label>
                    <input 
                        type="tel" 
                        id="verifyMobile" 
                        required 
                        maxlength="10" 
                        placeholder="१० अंकी मोबाईल नंबर"
                        class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-amber-500 outline-none text-sm"
                    >
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                        ईमेल आयडी *
                    </label>
                    <input 
                        type="email" 
                        id="verifyEmail" 
                        required 
                        placeholder="नोंदणीकृत ईमेल"
                        class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-amber-500 outline-none text-sm"
                    >
                </div>

                <div class="pt-2">
                    <button 
                        type="submit" 
                        id="verifyBtn"
                        class="w-full py-3 rounded-xl font-bold text-slate-950 bg-amber-500 hover:bg-amber-400 shadow-md transition text-sm flex items-center justify-center space-x-2"
                    >
                        <i class="fa-solid fa-user-check"></i>
                        <span>माहिती पडताळा</span>
                    </button>
                </div>
            </form>

            <!-- टप्पा २: नवीन पासवर्ड सेट फॉर्म (पडताळणीनंतर उघडेल) -->
            <form id="newPasswordForm" class="hidden p-6 sm:p-8 space-y-4 bg-amber-50/50 border-t border-amber-200">
                <div class="p-3 bg-emerald-100 text-emerald-800 rounded-xl text-xs font-bold flex items-center">
                    <i class="fa-solid fa-circle-check mr-2 text-base text-emerald-600"></i>
                    <div>माहिती पडताळणी यशस्वी! आता नवीन पासवर्ड सेट करा.</div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                        नवीन पासवर्ड *
                    </label>
                    <input 
                        type="password" 
                        id="newPassword" 
                        required 
                        minlength="6" 
                        placeholder="किमान ६ अक्षरे/अंक"
                        class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-amber-500 outline-none text-sm"
                    >
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                        नवीन पासवर्ड पुन्हा टाका *
                    </label>
                    <input 
                        type="password" 
                        id="confirmPassword" 
                        required 
                        minlength="6" 
                        placeholder="पुन्हा तोच पासवर्ड टाका"
                        class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-amber-500 outline-none text-sm"
                    >
                </div>

                <div class="pt-2">
                    <button 
                        type="submit" 
                        id="savePasswordBtn"
                        class="w-full py-3 rounded-xl font-extrabold text-white bg-emerald-600 hover:bg-emerald-500 shadow-md transition text-sm flex items-center justify-center space-x-2"
                    >
                        <i class="fa-solid fa-floppy-disk"></i>
                        <span>नवीन पासवर्ड सेव्ह करा</span>
                    </button>
                </div>
            </form>

            <div class="p-4 bg-slate-50 border-t border-slate-200 text-center text-xs text-slate-600">
                पासवर्ड आठवला आहे का? <a href="login.html" class="text-blue-700 font-bold hover:underline ml-1">लॉगिन करा</a>
            </div>
        </div>
    </main>

    <!-- ३. फूटर -->
    <footer class="bg-slate-950 text-slate-500 text-xs py-4 text-center border-t border-slate-800">
        महाराष्ट्र पोलीस भरती सराव परीक्षा पोर्टल &copy; २०२५-२०२६.
    </footer>

    <!-- Supabase CDN आणि कॉन्फिगरेशन स्क्रिप्ट -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>

    <script>
        let verifiedStudentId = null;

        // SHA-256 हॅशिंग
        async function localHashPassword(plain) {
            try {
                const encoder = new TextEncoder();
                const data = encoder.encode(plain);
                const hashBuffer = await crypto.subtle.digest('SHA-256', data);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            } catch (e) {
                let h = 0;
                for (let i = 0; i < plain.length; i++) {
                    h = ((h << 5) - h) + plain.charCodeAt(i);
                    h |= 0;
                }
                return "hash_" + Math.abs(h);
            }
        }

        function getSupabaseClient() {
            if (window.supabaseClient && typeof window.supabaseClient.from === 'function') {
                return window.supabaseClient;
            }
            const url = localStorage.getItem('pyq_supabase_url') || (typeof DEFAULT_SUPABASE_URL !== 'undefined' ? DEFAULT_SUPABASE_URL : '');
            const key = localStorage.getItem('pyq_supabase_anon_key') || (typeof DEFAULT_SUPABASE_ANON_KEY !== 'undefined' ? DEFAULT_SUPABASE_ANON_KEY : '');
            if (window.supabase && typeof window.supabase.createClient === 'function' && url && !url.includes("your-project-id")) {
                window.supabaseClient = window.supabase.createClient(url, key);
                return window.supabaseClient;
            }
            return null;
        }

        // टप्पा १: पडताळणी सबमिट
        const verifyForm = document.getElementById('verifyForm');
        verifyForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const mobile = document.getElementById('verifyMobile').value.trim();
            const email = document.getElementById('verifyEmail').value.trim();

            if (!/^\d{10}$/.test(mobile)) {
                Swal.fire({ icon: 'warning', title: 'अवैध मोबाईल', text: 'कृपया योग्य १० अंकी मोबाईल नंबर टाका.' });
                return;
            }

            const client = getSupabaseClient();
            if (!client) {
                Swal.fire({ icon: 'error', title: 'त्रुटी', text: 'Supabase शी संपर्क होऊ शकला नाही.' });
                return;
            }

            const btn = document.getElementById('verifyBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> पडताळणी सुरू आहे...';

            try {
                const { data, error } = await client
                    .from('students')
                    .select('id, full_name, mobile, email')
                    .eq('mobile', mobile)
                    .ilike('email', email);

                if (error) throw error;

                if (!data || data.length === 0) {
                    Swal.fire({
                        icon: 'error',
                        title: 'खाते सापडले नाही',
                        text: 'हा मोबाईल नंबर आणि ईमेल एकमेकांशी जुळत नाहीत. कृपया पुन्हा तपासा.',
                        confirmButtonColor: '#dc2626'
                    });
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-user-check mr-1"></i> माहिती पडताळा';
                    return;
                }

                verifiedStudentId = data[0].id;
                verifyForm.classList.add('hidden');
                document.getElementById('newPasswordForm').classList.remove('hidden');

            } catch (err) {
                console.error(err);
                Swal.fire({ icon: 'error', title: 'त्रुटी', text: err.message });
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-user-check mr-1"></i> माहिती पडताळा';
            }
        });

        // टप्पा २: नवीन पासवर्ड सेव्ह करणे
        const newPasswordForm = document.getElementById('newPasswordForm');
        newPasswordForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const p1 = document.getElementById('newPassword').value;
            const p2 = document.getElementById('confirmPassword').value;

            if (p1 !== p2) {
                Swal.fire({ icon: 'warning', title: 'पासवर्ड जुळत नाही', text: 'दोन्ही पासवर्ड सारखेच असणे आवश्यक आहे.' });
                return;
            }

            if (p1.length < 6) {
                Swal.fire({ icon: 'warning', title: 'कमकुवत पासवर्ड', text: 'पासवर्ड किमान ६ अक्षरे किंवा अंकांचा असावा.' });
                return;
            }

            const client = getSupabaseClient();
            if (!client || !verifiedStudentId) return;

            const saveBtn = document.getElementById('savePasswordBtn');
            saveBtn.disabled = true;
            saveBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> सेव्ह होत आहे...';

            try {
                const newHash = await localHashPassword(p1);
                const { error } = await client
                    .from('students')
                    .update({ password_hash: newHash, updated_at: new Date().toISOString() })
                    .eq('id', verifiedStudentId);

                if (error) throw error;

                Swal.fire({
                    icon: 'success',
                    title: 'पासवर्ड यशस्वीरित्या बदलला!',
                    text: 'आता तुम्ही तुमच्या नवीन पासवर्डने लॉगिन करू शकता.',
                    confirmButtonColor: '#10b981',
                    confirmButtonText: 'लॉगिन करा'
                }).then(() => {
                    window.location.href = 'login.html';
                });

            } catch(err) {
                console.error(err);
                Swal.fire({ icon: 'error', title: 'त्रुटी', text: err.message });
                saveBtn.disabled = false;
                saveBtn.innerHTML = '<i class="fa-solid fa-floppy-disk mr-1"></i> नवीन पासवर्ड सेव्ह करा';
            }
        });
    </script>
</body>
</html>
