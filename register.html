<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>नवीन विद्यार्थी नोंदणी | महाराष्ट्र पोलीस भरती परीक्षा पोर्टल</title>
    <!-- Google Fonts: Noto Sans Devanagari & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- सानुकूल स्टाइलशीट -->
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: 'Noto Sans Devanagari', 'Inter', sans-serif;
            background-color: #f8fafc;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- १. नेव्हिगेशन हेडर -->
    <header class="bg-slate-900 border-b border-slate-800 text-white py-3.5 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between">
            <a href="index.html" class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-full bg-amber-500 text-slate-950 flex items-center justify-center font-bold text-lg shadow-md border-2 border-amber-300">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <span class="font-bold text-base sm:text-lg text-white">पोलीस भरती परीक्षा पोर्टल</span>
            </a>
            <a href="login.html" class="text-sm text-slate-300 hover:text-amber-400 font-medium transition flex items-center">
                <i class="fa-solid fa-right-to-bracket mr-1.5"></i> आधीच नोंदणी झाली आहे? लॉगिन करा
            </a>
        </div>
    </header>

    <!-- २. मुख्य नोंदणी कार्ड -->
    <main class="flex-grow flex items-center justify-center px-4 py-8 sm:py-12">
        <div class="max-w-lg w-full bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
            <!-- कार्ड हेडर -->
            <div class="bg-gradient-to-r from-slate-900 via-blue-950 to-slate-900 p-6 text-white text-center border-b border-slate-800">
                <div class="w-14 h-14 mx-auto rounded-2xl bg-amber-500/20 text-amber-400 border border-amber-500/30 flex items-center justify-center text-2xl mb-3 shadow-inner">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
                <h2 class="text-2xl font-extrabold tracking-wide">नवीन विद्यार्थी नोंदणी</h2>
                <p class="text-xs sm:text-sm text-slate-300 mt-1">
                    सराव परीक्षा सुरू करण्यासाठी तुमची अधिकृत माहिती भरा (कोणत्याही ईमेल पडताळणीची गरज नाही).
                </p>
            </div>

            <!-- नोंदणी फॉर्म -->
            <form id="registerForm" class="p-6 sm:p-8 space-y-4">
                <!-- १. पूर्ण नाव -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                        <i class="fa-solid fa-user text-amber-500 mr-1"></i> पूर्ण नाव (First & Last Name) *
                    </label>
                    <input 
                        type="text" 
                        id="fullName" 
                        required 
                        placeholder="उदा. राहुल बाळकृष्ण पाटील"
                        class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 text-sm outline-none transition font-medium"
                    >
                </div>

                <!-- २. मोबाईल नंबर -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                        <i class="fa-solid fa-phone text-amber-500 mr-1"></i> १०-अंकी मोबाईल नंबर (हेच तुमचे युजरनेम असेल) *
                    </label>
                    <input 
                        type="tel" 
                        id="mobile" 
                        required 
                        maxlength="10" 
                        placeholder="उदा. 9876543210"
                        class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 text-sm outline-none transition font-medium"
                    >
                </div>

                <!-- ३. ईमेल आयडी -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                        <i class="fa-solid fa-envelope text-amber-500 mr-1"></i> ईमेल आयडी (पासवर्ड बदलण्यासाठी उपयोगी) *
                    </label>
                    <input 
                        type="email" 
                        id="email" 
                        required 
                        placeholder="उदा. rahul.patil@gmail.com"
                        class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 text-sm outline-none transition"
                    >
                </div>

                <!-- ४. भरतीचे नाव / संवर्ग -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                        <i class="fa-solid fa-shield-halved text-amber-500 mr-1"></i> इच्छित पोलीस भरती संवर्ग *
                    </label>
                    <select 
                        id="bhartiType" 
                        required
                        class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 text-sm outline-none transition bg-white font-medium"
                    >
                        <option value="जिल्हा पोलीस शिपाई" selected>जिल्हा पोलीस शिपाई</option>
                        <option value="SRPF (राज्य राखीव पोलीस बल)">SRPF (राज्य राखीव पोलीस बल)</option>
                        <option value="पोलीस शिपाई चालक">पोलीस शिपाई चालक</option>
                        <option value="कारागृह पोलीस शिपाई">कारागृह पोलीस शिपाई</option>
                        <option value="लोहमार्ग / रेल्वे पोलीस">लोहमार्ग / रेल्वे पोलीस</option>
                        <option value="पोलीस बँड्समन">पोलीस बँड्समन</option>
                    </select>
                </div>

                <!-- ५. पासवर्ड व खात्री -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                            <i class="fa-solid fa-key text-amber-500 mr-1"></i> पासवर्ड (किमान ६ अक्षरे) *
                        </label>
                        <input 
                            type="password" 
                            id="password" 
                            required 
                            minlength="6" 
                            placeholder="••••••"
                            class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 text-sm outline-none transition"
                        >
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                            <i class="fa-solid fa-check-double text-amber-500 mr-1"></i> पासवर्ड खात्री करा *
                        </label>
                        <input 
                            type="password" 
                            id="confirmPassword" 
                            required 
                            minlength="6" 
                            placeholder="••••••"
                            class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 text-sm outline-none transition"
                        >
                    </div>
                </div>

                <!-- नोंदणी सबमिट बटण -->
                <div class="pt-4">
                    <button 
                        type="submit" 
                        id="submitBtn"
                        class="w-full py-3.5 px-4 rounded-xl font-bold text-slate-950 bg-amber-500 hover:bg-amber-400 shadow-lg hover:shadow-amber-500/25 transition-all text-base flex items-center justify-center space-x-2"
                    >
                        <i class="fa-solid fa-paper-plane"></i>
                        <span>नोंदणी पूर्ण करा (Register)</span>
                    </button>
                </div>
            </form>

            <!-- कार्ड तळटीप -->
            <div class="p-4 bg-slate-50 border-t border-slate-200 text-center text-xs text-slate-600">
                आधीच नोंदणी केली आहे का? 
                <a href="login.html" class="text-blue-700 font-bold hover:underline ml-1">येथे लॉगिन करा</a>
            </div>
        </div>
    </main>

    <!-- ३. सामान्य फूटर -->
    <footer class="bg-slate-900 text-slate-400 text-xs py-4 text-center border-t border-slate-800">
        महाराष्ट्र पोलीस भरती सराव परीक्षा पोर्टल &copy; २०२५-२०२६.
    </footer>

    <!-- Supabase CDN आणि कॉन्फिगरेशन स्क्रिप्ट -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        const registerForm = document.getElementById('registerForm');
        const submitBtn = document.getElementById('submitBtn');

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const mobile = document.getElementById('mobile').value.trim();
            const email = document.getElementById('email').value.trim();
            const bhartiType = document.getElementById('bhartiType').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // १. इनपुट व्हॅलिडेशन्स
            if (!/^\d{10}$/.test(mobile)) {
                Swal.fire({
                    icon: 'warning',
                    title: 'अवैध मोबाईल नंबर',
                    text: 'कृपया बरोबर १० अंकी मोबाईल नंबर टाका.',
                    confirmButtonColor: '#f59e0b',
                    confirmButtonText: 'समजले'
                });
                return;
            }

            if (password.length < 6) {
                Swal.fire({
                    icon: 'warning',
                    title: 'कमी लांबीचा पासवर्ड',
                    text: 'पासवर्ड किमान ६ अक्षरांचा असणे आवश्यक आहे.',
                    confirmButtonColor: '#f59e0b',
                    confirmButtonText: 'समजले'
                });
                return;
            }

            if (password !== confirmPassword) {
                Swal.fire({
                    icon: 'error',
                    title: 'पासवर्ड जुळत नाही',
                    text: 'दोन्ही पासवर्ड एकसारखे असणे आवश्यक आहे. कृपया पुन्हा तपासा.',
                    confirmButtonColor: '#dc2626',
                    confirmButtonText: 'पुन्हा टाका'
                });
                return;
            }

            // २. नोंदणी प्रक्रिया सुरू करणे
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> नोंदणी सुरू आहे...';

            try {
                if (typeof DB === 'undefined' || !DB.registerStudent) {
                    throw new Error("डेटाबेस सेवा लोड झालेली नाही. कृपया supabase-config.js योग्यरित्या जोडली आहे का ते तपासा.");
                }

                const result = await DB.registerStudent({
                    fullName,
                    mobile,
                    email,
                    bhartiType,
                    password
                });

                if (result.success) {
                    // ईमेल पडताळणीशिवाय थेट यशस्वी संदेश
                    Swal.fire({
                        icon: 'success',
                        title: 'नोंदणी यशस्वी झाली!',
                        text: 'ॲडमिनच्या मंजुरीनंतर तुमचे लॉगिन सुरू होईल. कृपया थोडा वेळ वाट पहा.',
                        confirmButtonColor: '#10b981',
                        confirmButtonText: 'लॉगिन पेजवर जा',
                        allowOutsideClick: false
                    }).then(() => {
                        window.location.href = 'login.html';
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'नोंदणी अयशस्वी',
                        text: result.message || 'नोंदणी करताना त्रुटी आली. कृपया माहिती तपासा.',
                        confirmButtonColor: '#dc2626',
                        confirmButtonText: 'ठीक आहे'
                    });
                }
            } catch (err) {
                console.error("नोंदणी त्रुटी:", err);
                Swal.fire({
                    icon: 'error',
                    title: 'नोंदणी अयशस्वी',
                    text: (err && err.message) ? err.message : 'नोंदणी करताना अडचण आली. कृपया पुन्हा प्रयत्न करा.',
                    confirmButtonColor: '#dc2626',
                    confirmButtonText: 'ठीक आहे'
                });
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane mr-2"></i> नोंदणी पूर्ण करा (Register)';
            }
        });
    </script>
</body>
</html>
